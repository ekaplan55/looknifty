<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizlilik — LookNifty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #12100e; --ink: #f3efe6; --muted: #a39b92; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: var(--bg); color: var(--ink);
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }
        main { max-width: 640px; margin: 0 auto; padding: 48px 28px 80px; }
        .wordmark {
            margin: 0; font-size: 12px; font-weight: 500;
            letter-spacing: 0.42em; text-indent: 0.42em;
        }
        h1 {
            margin: 36px 0 0;
            font-family: "Cormorant Garamond", serif;
            font-size: 44px; font-weight: 500; line-height: 1;
        }
        p { margin: 22px 0 0; font-size: 16px; line-height: 1.55; max-width: 34em; }
        a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="wordmark">LOOKNIFTY</p>
        <h1>Gizlilik</h1>
        <p>Yüklenen fotoğraf yalnız kombindeki parçaları okumak için kullanılır. LookNifty bu fotoğrafı saklamaz.</p>
        <p><a href="/">Uygulamayı aç</a></p>
        <p>İletişim: <a href="mailto:ekaplan55@gmail.com">ekaplan55@gmail.com</a></p>
    </main>
</body>
</html>
